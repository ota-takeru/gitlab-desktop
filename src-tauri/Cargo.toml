[package]
name = "gitlab-desktop"
version = "0.18.3"
description = "Personal GitLab desktop client"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "gitlab_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "gzip", "http2"] }
url = "2"
yaml-rust2 = { version = "0.13", default-features = false }
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
open = "5"
tauri-plugin-notification = "2"
encoding_rs = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
chardetng = "1"

[dev-dependencies]
serde_json = "1"
minisign-verify = "0.3"
