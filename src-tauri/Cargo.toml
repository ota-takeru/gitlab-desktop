[package]
name = "gitlab-desktop"
version = "0.3.0"
description = "Personal GitLab desktop client"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "gitlab_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
url = "2"
yaml-rust2 = { version = "0.13", default-features = false }
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process", "io-util"] }
tokio-util = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = { version = "3", features = ["windows-native"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-updater = "2"
open = "5"
tauri-plugin-notification = "2"

[dev-dependencies]
serde_json = "1"
minisign-verify = "0.2"
