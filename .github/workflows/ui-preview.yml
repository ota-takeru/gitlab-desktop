name: UI Preview

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: Preview screenshots
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Capture live UI using fixture IPC
        run: npx playwright test tests/visual/preview.visual.ts --workers=1
      - name: Export audited dependency manifests (temporary)
        if: github.event_name == 'pull_request'
        run: |
          npm install --package-lock-only --save-dev --save-exact vite@8.3.5 vitest@5.0.5
          npm audit fix --package-lock-only
          npm audit --audit-level=moderate
          node -e 'const fs = require("fs"); for (const name of ["package.json", "package-lock.json"]) { const value = fs.readFileSync(name, "utf8"); let part = 0; for (let offset = 0; offset < value.length; offset += 2048) { console.log("AUDITED_FILE_PART|" + name + "|" + part + "|" + JSON.stringify(value.slice(offset, offset + 2048))); part += 1; } console.log("AUDITED_FILE_END|" + name + "|" + value.length + "|" + part); }'
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitlab-desktop-ui-preview
          path: output/ui-snap/results/**/*.png
          if-no-files-found: warn
          retention-days: 7
