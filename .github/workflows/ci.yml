name: CI

# Keep this reusable from release.yml, but run the two independent stacks in parallel.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Commit or tag to check; empty checks the triggering commit'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Only PRs cancel obsolete checks. A release's verification must not be cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Reject high-severity npm advisories
        run: npm audit --audit-level=high

      - name: Run release script tests
        run: node --test scripts/release-config.test.mjs

      - name: Run frontend checks
        run: |
          npm run lint
          npm run test:coverage
          npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: output/coverage
          if-no-files-found: warn
          retention-days: 14

  rust:
    name: Rust checks
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # PR branches may reuse compilation artifacts across incremental changes.
          save-if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

      - name: Run Rust checks
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --locked

  # Preserve the former required check name while guarding BOTH jobs.
  status:
    name: Windows checks
    if: always()
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Ensure all checks passed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
