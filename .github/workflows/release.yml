name: Release Windows installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing v<version> tag to build and publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# The checks in ci.yml and the signed build run side by side; only the publish job writes to the repository,
# and it waits for both.
jobs:
  decide:
    name: Decide the release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.source.outputs.ref }}
      should_release: ${{ steps.release_decision.outputs.should_release }}
      auto_bump: ${{ steps.release_decision.outputs.auto_bump }}
      release_tag: ${{ steps.release_decision.outputs.release_tag }}
      release_version: ${{ steps.release_decision.outputs.release_version }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      # The pushed range decides whether the version changed and whether only documentation changed.
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - name: Select the commit to release
        id: source
        # The pushed commit itself, so a later push to main cannot slip into this release.
        run: echo "ref=${{ inputs.release_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Decide whether this push should publish a release
        id: release_decision
        run: node scripts/release-main.mjs

  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml
    with:
      # The same commit as decide selects; set here so the checks start without waiting for it.
      ref: ${{ inputs.release_tag || github.sha }}
    permissions:
      contents: read

  build:
    name: Build signed NSIS installer
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      tree: ${{ steps.bump.outputs.tree }}
    env:
      RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      # A main push creates its tag only after the checks pass, so the tag is checked again before publishing.
      VERIFY_TAG_AT_HEAD: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
      TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: '1.98.0'
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Bump the patch version for a main push without a version change
        id: bump
        shell: pwsh
        run: |
          if ('${{ needs.decide.outputs.auto_bump }}' -eq 'true') {
            node scripts/version-bump.mjs '${{ needs.decide.outputs.release_version }}'
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # The publish job makes the same bump and checks that it releases exactly this tree.
          git add --all
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tree=$(git write-tree)"

      - name: Validate version and release tag
        run: node scripts/release-guard.mjs

      - name: Generate signed updater configuration
        run: node scripts/release-config.mjs

      - name: Build the signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --config src-tauri/tauri.release.conf.json

      - name: Prepare the installer, signature and latest.json
        run: node scripts/updater-manifest.mjs "src-tauri/target/release/bundle/nsis/GitLab Desktop_${{ needs.decide.outputs.release_version }}_x64-setup.exe" release-assets

      - name: Keep the release assets for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish signed release
    needs: [decide, verify, build]
    if: needs.decide.outputs.should_release == 'true'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.decide.outputs.release_tag }}
      VERIFY_TAG_AT_HEAD: 'true'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Commit the patch version for a main push without a version change
        if: needs.decide.outputs.auto_bump == 'true'
        shell: pwsh
        run: |
          node scripts/version-bump.mjs '${{ needs.decide.outputs.release_version }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit --all --message 'Release ${{ needs.decide.outputs.release_tag }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check that the commit to tag is the one that was built
        shell: pwsh
        run: |
          $tree = git rev-parse 'HEAD^{tree}'
          if ($tree -ne '${{ needs.build.outputs.tree }}') {
            Write-Error "The commit to tag ($tree) differs from the built source (${{ needs.build.outputs.tree }})"
            exit 1
          }

      - name: Create the immutable version tag for a main push
        if: github.event_name == 'push' && github.ref_name == 'main'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The verified version commit goes to main first; a push made meanwhile rejects it and stops the release.
          # Pushes with GITHUB_TOKEN do not start workflows, so this commit does not trigger another release.
          if ('${{ needs.decide.outputs.auto_bump }}' -eq 'true') {
            git push origin HEAD:refs/heads/main
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          git tag '${{ needs.decide.outputs.release_tag }}'
          git push origin 'refs/tags/${{ needs.decide.outputs.release_tag }}'

      - name: Validate version and release tag
        run: node scripts/release-guard.mjs

      - name: Download the release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets

      - name: Publish the GitHub Release
        shell: pwsh
        run: |
          $assets = (Get-ChildItem release-assets -File).FullName
          $notes = (Get-Content release-assets/latest.json -Raw | ConvertFrom-Json).notes
          # A rerun for an existing tag replaces the assets of its release.
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --title "GitLab Desktop $env:RELEASE_TAG" --notes $notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
