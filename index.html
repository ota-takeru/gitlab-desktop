<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Canvas colours of src/theme.ts, shown before the app mounts so a dark start does not flash white. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#232529" />
    <style>
      html { background: #ffffff; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html { background: #232529; } }
    </style>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>GitLab Desktop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
